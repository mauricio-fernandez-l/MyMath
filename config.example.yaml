# Configuration file for MyMath Game
title: "MyMath"
icon_image: "data/icon/MyMath.png"

# Image settings
images_folder: "data/images"

# Sound settings
sound:
  enabled: true
  correct_sound: "data/sounds"

# Video reward settings
video:
  videos_folder: "data/videos"
  min_rounds: 7
  max_wrong: 1

# Window settings
window:
  fullscreen: true

# Game settings (shared across all game modes)
game:
  # Maximum number for counting/addition
  max_number: 10
  # Number of rounds per game session
  rounds: 10
  # Maximum size of each image in pixels (preserves aspect ratio)
  image_size: 150
  # Delay between steps in milliseconds (images appear, then answers appear)
  delay_ms: 1000
  # Gap in pixels between groups of 5 when displaying 10 images
  group_gap: 30
  # Delay before showing visual hints
  hint_delay_ms: 3000
  # Color of the first number in arithmetic modes
  color1: "#4C7CF0"
  # Color of the second number and subtraction hint borders
  color2: "#F4A261"
  # Color of the result placeholder and answer buttons
  color3: "#2EC4B6"
  # Color used for correct answers and positive progress
  correct_color: "#00FF00"
  # Color used for incorrect answers and soft warning states
  incorrect_color: "#FDE68A"